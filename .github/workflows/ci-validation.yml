name: CI Validation Pipeline

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-repository:
    name: Static Code & Data Integrity Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: enterprise_real_sot

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install CI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CI Validation Suite (Layers 1-12: syntax, imports, CSV/YAML config,
          capability gate, rollback, observability config, ServiceNow integration,
          maintenance mode, rollback manager, ServiceNow failure handling, security sanity)
        run: |
          python3 tests/ci_runner.py
