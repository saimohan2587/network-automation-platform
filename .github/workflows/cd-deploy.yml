name: CD Deploy (Controlled Deployment with Staging Tollgates & Production Approval)

# Manual trigger ONLY. Deployment must always be explicitly started by an authorized
# engineer naming the EXACT Phase 3 artifact to deploy -- never "latest".
#
# LIFECYCLE ARCHITECTURE:
#
# Generate Configuration / Existing Artifact
#               ↓
#       STAGING DEVICES
#               ↓
#       Pre-Deployment Validation
#               ↓
#       Staging Deployment
#               ↓
#       Staging Post-Deployment Validation
#               ↓
#        All Staging Successful?
#           ↙           ↘
#         NO             YES
#          ↓              ↓
#  Block Production    Production Approval
#  Record Evidence          ↓
#                     PRODUCTION DEVICES
#                           ↓
#                  Pre-Deployment Validation
#                           ↓
#                  Production Deployment
#                           ↓
#                  Post-Deployment Validation
#                           ↓
#                    Final Result
"on":
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: >
          The GitHub Actions run ID of the "CD Plan" workflow run that
          produced the artifact to deploy (found in that run's URL, e.g.
          .../actions/runs/<number>). Pins the exact plan run -- never
          "whatever ran most recently".
        required: true
      artifact_name:
        description: >
          The exact artifact name from that Plan run's summary/upload step,
          e.g. "pre_deployment_20260907_153000_gns3-staging". Pins the exact
          artifact bundle within that run.
        required: true
      save_config:
        description: "Persist to startup-config after pushing (same as deployment/cli.py --save-config). Default: false."
        required: false
        default: "false"

permissions:
  contents: read
  actions: read   # required to download an artifact from a DIFFERENT run (artifact_run_id)

concurrency:
  group: cd-deploy-fleet
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # STAGE 1: STAGING DEVICES LIFECYCLE & TOLLGATE
  # ==========================================================================
  deploy-staging:
    name: Staging Lifecycle & Tollgate
    runs-on: self-hosted
    environment: staging

    defaults:
      run:
        working-directory: enterprise_real_sot

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          python3 -m pip install --break-system-packages -r requirements.txt

      - name: Resolve Artifact Paths
        id: paths
        run: |
          RAW_NAME="${{ github.event.inputs.artifact_name }}"
          TRIMMED_NAME=$(echo "$RAW_NAME" | xargs)
          RAW_RUN_ID="${{ github.event.inputs.artifact_run_id }}"
          TRIMMED_RUN_ID=$(echo "$RAW_RUN_ID" | xargs)
          echo "artifact_name=${TRIMMED_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_run_id=${TRIMMED_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "workspace_relative=enterprise_real_sot/artifacts/deployed/${TRIMMED_NAME}" >> "$GITHUB_OUTPUT"
          echo "job_relative=artifacts/deployed/${TRIMMED_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download Approved Deployment Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.paths.outputs.artifact_name }}
          run-id: ${{ steps.paths.outputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ steps.paths.outputs.workspace_relative }}

      - name: Verify Artifact Integrity (manifest, hashes, batch_hash, deployable)
        id: verify
        env:
          ARTIFACT_DIR: ${{ steps.paths.outputs.job_relative }}
        run: |
          python3 << 'PYEOF'
          import os
          import sys
          from pathlib import Path

          from deployment.artifact_manager import verify_manifest

          artifact_dir = Path(os.environ["ARTIFACT_DIR"])
          result = verify_manifest(artifact_dir)
          manifest = result["manifest"] or {}

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"valid={'true' if result['valid'] else 'false'}\n")
              f.write(f"batch_id={manifest.get('batch_id', '')}\n")
              f.write(f"git_commit_sha={manifest.get('git_commit_sha', '')}\n")

          if not result["valid"]:
              print("Artifact verification FAILED -- deployment will NOT proceed:")
              for err in result["errors"]:
                  print(f"  - {err}")
              sys.exit(1)

          devices = manifest.get("devices", [])
          print(f"Artifact verified OK. batch_id={manifest.get('batch_id')} deployable={manifest.get('deployable')} devices={len(devices)}")
          PYEOF

      - name: Write Pre-Deployment Plan Summary (Staging)
        if: ${{ !cancelled() && steps.verify.outputs.valid == 'true' }}
        env:
          ARTIFACT_DIR: ${{ steps.paths.outputs.job_relative }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          from pathlib import Path

          artifact_dir = Path(os.environ["ARTIFACT_DIR"])
          manifest = json.loads((artifact_dir / "manifest.json").read_text(encoding="utf-8"))
          devices = manifest.get("devices", [])

          lines = [
              "## Staging Deployment Plan (Tollgate 1)\n",
              f"- **Target Environment**: `STAGING`",
              f"- **Batch ID**: `{manifest.get('batch_id')}`",
              f"- **Git Commit SHA (artifact origin)**: `{manifest.get('git_commit_sha')}`",
              f"- **Artifact Name**: `${{ steps.paths.outputs.artifact_name }}`",
              f"- **Source Plan Run ID**: `${{ steps.paths.outputs.artifact_run_id }}`",
              f"- **Total Candidates in Artifact**: {len(devices)}",
              "- **Triggered By**: `${{ github.actor }}`",
              "- **Execution Reference**: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`\n",
              "### Candidate Devices in Manifest\n",
              "| Device ID | Device Name | Config File |",
              "|---|---|---|",
          ]
          for d in devices:
              lines.append(f"| {d.get('device_id')} | {d.get('device_name')} | {d.get('config_file')} |")
          lines.append("")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PYEOF

      # --------------------------------------------------------------------
      # 1. PRE-DEPLOYMENT VALIDATION (STAGING DEVICES)
      # --------------------------------------------------------------------
      - name: 1. Pre-Deployment Validation (Staging Devices)
        id: pre_deploy_staging
        if: ${{ !cancelled() && steps.verify.outputs.valid == 'true' }}
        env:
          NETBOX_URL: ${{ secrets.NETBOX_URL }}
          NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_SECRET: ${{ secrets.SSH_SECRET }}
          ARTIFACT_DIR: ${{ steps.paths.outputs.job_relative }}
        run: |
          set -o pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Executing Pre-Deployment Validation for Staging Devices..."
          python3 -m deployment.cli \
            --use-artifact-dir "$ARTIFACT_DIR" \
            --environment staging \
            --dry-run \
            --approved-by "${{ github.actor }}" \
            --approval-ref "$RUN_URL" \
            2>&1 | tee cd_pre_deploy_staging.log
          echo "pre_deploy_exit_code=$?" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------------
      # 2. STAGING DEPLOYMENT (REAL SSH -- PER-DEVICE FAILURE ISOLATION & ROLLBACK)
      # --------------------------------------------------------------------
      - name: 2. Staging Deployment (REAL SSH)
        id: deploy
        if: ${{ !cancelled() && steps.verify.outputs.valid == 'true' && steps.pre_deploy_staging.outputs.pre_deploy_exit_code == '0' }}
        continue-on-error: true
        env:
          NETBOX_URL: ${{ secrets.NETBOX_URL }}
          NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_SECRET: ${{ secrets.SSH_SECRET }}
          ARTIFACT_DIR: ${{ steps.paths.outputs.job_relative }}
        run: |
          set -o pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SAVE_FLAG=""
          if [ "${{ github.event.inputs.save_config }}" = "true" ]; then
            SAVE_FLAG="--save-config"
          fi
          echo "Executing Staging Deployment and Post-Deployment Validation..."
          python3 -m deployment.cli \
            --use-artifact-dir "$ARTIFACT_DIR" \
            --environment staging \
            --approved-by "${{ github.actor }}" \
            --approval-ref "$RUN_URL" \
            $SAVE_FLAG \
            2>&1 | tee cd_deploy_staging_output.log
          echo "cli_exit_code=$?" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------------
      # 3. STAGING POST-DEPLOYMENT VALIDATION & AUDIT SUMMARY
      # --------------------------------------------------------------------
      - name: 3. Staging Post-Deployment Validation & Summary
        id: summary
        if: ${{ !cancelled() && steps.verify.outputs.valid == 'true' }}
        env:
          ARTIFACT_DIR: ${{ steps.paths.outputs.job_relative }}
          CLI_EXIT_CODE: ${{ steps.deploy.outputs.cli_exit_code }}
          PRE_EXIT_CODE: ${{ steps.pre_deploy_staging.outputs.pre_deploy_exit_code }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          from pathlib import Path

          artifact_dir = Path(os.environ["ARTIFACT_DIR"])
          result_path = artifact_dir / "deployment_result.json"
          cli_exit_code = os.environ.get("CLI_EXIT_CODE", "unknown")
          pre_exit_code = os.environ.get("PRE_EXIT_CODE", "unknown")

          BAD_VERDICTS = {"DRIFT", "UNREACHABLE", "FAILED"}
          lines = ["## Staging Lifecycle & Compliance Summary\n"]
          lines.append(f"- **Pre-Deployment Validation Exit Code**: `{pre_exit_code}`")
          lines.append(f"- **Deployment & Verification Exit Code**: `{cli_exit_code}`\n")

          deploy_ok = False
          drift_detected = False
          deployment_failed = False
          unreachable_detected = False
          drift_details = []

          if pre_exit_code != "0":
              lines.append("> [!CAUTION]\n> ### Staging Pre-Deployment Validation Failed!\n")
              deployment_failed = True
          elif not result_path.exists():
              lines.append(f"No `deployment_result.json` was produced (deployment/cli.py exit code: `{cli_exit_code}`).\n")
              lines.append("This means deployment did not reach the point of recording per-device results -- treat as FAILED.\n")
              deployment_failed = True
          else:
              payload = json.loads(result_path.read_text(encoding="utf-8"))
              results = payload.get("results", [])

              if not results:
                  lines.append("No staging devices were targeted in this artifact.\n")
                  deploy_ok = True
              else:
                  lines.append("| Device | Deployment Status | Post-Deployment Verification |")
                  lines.append("|---|---|---|")
                  for r in results:
                      lines.append(f"| {r.get('device_name')} | {r.get('deployment_status')} | {r.get('verification_status')} |")
                      if r.get("deployment_status") != "success":
                          deployment_failed = True
                      elif r.get("verification_status") == "DRIFT":
                          drift_detected = True
                      elif r.get("verification_status") == "UNREACHABLE":
                          unreachable_detected = True
                      elif r.get("verification_status") in BAD_VERDICTS:
                          deployment_failed = True
                  lines.append("")

                  deploy_ok = (pre_exit_code == "0") and bool(results) and all(
                      r.get("deployment_status") == "success" and r.get("verification_status") not in BAD_VERDICTS
                      for r in results
                  )

              lines.append(f"- **Overall Staging Outcome**: {'READY FOR PRODUCTION APPROVAL' if deploy_ok else 'TOLLGATE BLOCKED -- Staging failed or drifted'}\n")

              post_dir = Path("artifacts/post_deployment")
              if post_dir.exists():
                  for r in results:
                      dev_name = r.get("device_name")
                      if r.get("verification_status") == "DRIFT":
                          matching_files = sorted(post_dir.glob(f"*/{dev_name}.json"), key=os.path.getmtime, reverse=True)
                          if matching_files:
                              try:
                                  dev_audit = json.loads(matching_files[0].read_text(encoding="utf-8"))
                                  for d in dev_audit.get("drifts", []):
                                      drift_details.append({
                                          "device": dev_name,
                                          "protocol": d.get("protocol", "unknown"),
                                          "scope": d.get("scope", "global"),
                                          "field": d.get("field_name", "unknown"),
                                          "expected": str(d.get("expected", "")),
                                          "actual": str(d.get("actual", "")),
                                          "reason": d.get("reason", "Value mismatch")
                                      })
                              except Exception as err:
                                  print(f"Warning reading post-deployment audit file {matching_files[0]}: {err}")

              if drift_detected and not deployment_failed:
                  lines.append("> [!WARNING]")
                  lines.append("> ### ⚠️ Staging Succeeded via SSH, but Post-Deployment Drift was Detected!")
                  lines.append("> All staging configuration commands were pushed and backed up.")
                  lines.append("> However, post-deployment verification identified that live device state differs from NetBox Source of Truth.\n")

              if drift_details:
                  lines.append("### 🔍 Detected Configuration Drift Details\n")
                  lines.append("| Device | Protocol | Scope | Parameter | Expected (NetBox SoT) | Actual (Live Device) | Mismatch Reason |")
                  lines.append("|---|---|---|---|---|---|---|")
                  for item in drift_details:
                      lines.append(f"| `{item['device']}` | `{item['protocol']}` | `{item['scope']}` | `{item['field']}` | `{item['expected']}` | `{item['actual']}` | {item['reason']} |")
                  lines.append("")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"deploy_ok={'true' if deploy_ok else 'false'}\n")
              f.write(f"drift_detected={'true' if drift_detected else 'false'}\n")
              f.write(f"unreachable_detected={'true' if unreachable_detected else 'false'}\n")
              f.write(f"deployment_failed={'true' if deployment_failed else 'false'}\n")
          PYEOF

      - name: Upload Staging Post-Deployment Compliance Audit Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: post_deployment_audit_staging_${{ github.run_id }}
          path: enterprise_real_sot/artifacts/post_deployment/
          if-no-files-found: ignore

      # --------------------------------------------------------------------
      # 4. ALL STAGING SUCCESSFUL? (TOLLGATE EVALUATION)
      # --------------------------------------------------------------------
      - name: 4. All Staging Successful? Tollgate (BLOCKS PRODUCTION IF FAILED)
        if: >-
          ${{ !cancelled() && (
            steps.verify.outputs.valid != 'true' ||
            steps.pre_deploy_staging.outputs.pre_deploy_exit_code != '0' ||
            steps.summary.outputs.deploy_ok != 'true'
          ) }}
        run: |
          if [ "${{ steps.pre_deploy_staging.outputs.pre_deploy_exit_code }}" != "0" ]; then
            echo "::error title=Staging Pre-Deployment Validation Failed::Pre-deployment validation checks failed for staging devices. Production deployment is BLOCKED by tollgate."
            exit 1
          elif [ "${{ steps.summary.outputs.drift_detected }}" = "true" ] && [ "${{ steps.summary.outputs.deployment_failed }}" != "true" ]; then
            echo "::error title=Staging Drift Detected::Configuration was pushed to staging device(s), but post-deployment compliance verification detected DRIFT. Production deployment is BLOCKED by tollgate."
            exit 1
          elif [ "${{ steps.summary.outputs.unreachable_detected }}" = "true" ] && [ "${{ steps.summary.outputs.deployment_failed }}" != "true" ]; then
            echo "::error title=Staging Device Unreachable::Staging device was unreachable during post-verification. Production deployment is BLOCKED by tollgate."
            exit 1
          elif [ "${{ steps.summary.outputs.deployment_failed }}" = "true" ]; then
            echo "::error title=Staging Deployment Failed::SSH deployment to one or more staging devices failed. Production deployment is BLOCKED by tollgate."
            exit 1
          else
            echo "::error title=Staging Tollgate Failed::Artifact integrity check or staging validation failed. Production deployment is BLOCKED by tollgate."
            exit 1
          fi

  # ==========================================================================
  # STAGE 2: PRODUCTION DEVICES LIFECYCLE (HUMAN APPROVAL GATE & PROMOTION)
  # ==========================================================================
  deploy-production:
    name: Production Lifecycle (Human Approved)
    runs-on: self-hosted
    needs: [deploy-staging]
    # --------------------------------------------------------------------
    # HUMAN APPROVAL GATE:
    # `environment: production` enforces a pause for review if configured
    # under repository Settings -> Environments -> "production" with
    # "Required reviewers". Deployment to production will NOT proceed until
    # an authorized reviewer approves the run in the GitHub Actions UI.
    # --------------------------------------------------------------------
    environment: production

    defaults:
      run:
        working-directory: enterprise_real_sot

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          python3 -m pip install --break-system-packages -r requirements.txt

      - name: Resolve Artifact Paths
        id: paths
        run: |
          RAW_NAME="${{ github.event.inputs.artifact_name }}"
          TRIMMED_NAME=$(echo "$RAW_NAME" | xargs)
          RAW_RUN_ID="${{ github.event.inputs.artifact_run_id }}"
          TRIMMED_RUN_ID=$(echo "$RAW_RUN_ID" | xargs)
          echo "artifact_name=${TRIMMED_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_run_id=${TRIMMED_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "workspace_relative=enterprise_real_sot/artifacts/deployed/${TRIMMED_NAME}" >> "$GITHUB_OUTPUT"
          echo "job_relative=artifacts/deployed/${TRIMMED_NAME}" >> "$GITHUB_OUTPUT"

      # Re-downloads the EXACT SAME immutable artifact bundle from the approved plan run.
      # No configuration regeneration is permitted.
      - name: Download Approved Deployment Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.paths.outputs.artifact_name }}
          run-id: ${{ steps.paths.outputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ steps.paths.outputs.workspace_relative }}

      - name: Verify Artifact Integrity (manifest, hashes, batch_hash, deployable)
        id: verify
        env:
          ARTIFACT_DIR: ${{ steps.paths.outputs.job_relative }}
        run: |
          python3 << 'PYEOF'
          import os
          import sys
          from pathlib import Path

          from deployment.artifact_manager import verify_manifest

          artifact_dir = Path(os.environ["ARTIFACT_DIR"])
          result = verify_manifest(artifact_dir)
          manifest = result["manifest"] or {}

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"valid={'true' if result['valid'] else 'false'}\n")
              f.write(f"batch_id={manifest.get('batch_id', '')}\n")
              f.write(f"git_commit_sha={manifest.get('git_commit_sha', '')}\n")

          if not result["valid"]:
              print("Artifact verification FAILED -- production deployment will NOT proceed:")
              for err in result["errors"]:
                  print(f"  - {err}")
              sys.exit(1)

          devices = manifest.get("devices", [])
          print(f"Production Artifact verified OK. batch_id={manifest.get('batch_id')} deployable={manifest.get('deployable')} devices={len(devices)}")
          PYEOF

      - name: Write Pre-Deployment Plan Summary (Production)
        if: ${{ !cancelled() && steps.verify.outputs.valid == 'true' }}
        env:
          ARTIFACT_DIR: ${{ steps.paths.outputs.job_relative }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          from pathlib import Path

          artifact_dir = Path(os.environ["ARTIFACT_DIR"])
          manifest = json.loads((artifact_dir / "manifest.json").read_text(encoding="utf-8"))
          devices = manifest.get("devices", [])

          lines = [
              "## Production Deployment Plan (Tollgate 2 -- Approved)\n",
              f"- **Target Environment**: `PRODUCTION`",
              f"- **Batch ID**: `{manifest.get('batch_id')}`",
              f"- **Git Commit SHA (artifact origin)**: `{manifest.get('git_commit_sha')}`",
              f"- **Artifact Name**: `${{ steps.paths.outputs.artifact_name }}`",
              f"- **Source Plan Run ID**: `${{ steps.paths.outputs.artifact_run_id }}`",
              f"- **Total Candidates in Artifact**: {len(devices)}",
              "- **Approved By**: `${{ github.actor }}`",
              "- **Approval Reference**: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`\n",
              "### Candidate Devices in Manifest\n",
              "| Device ID | Device Name | Config File |",
              "|---|---|---|",
          ]
          for d in devices:
              lines.append(f"| {d.get('device_id')} | {d.get('device_name')} | {d.get('config_file')} |")
          lines.append("")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PYEOF

      # --------------------------------------------------------------------
      # 1. PRE-DEPLOYMENT VALIDATION (PRODUCTION DEVICES)
      # --------------------------------------------------------------------
      - name: 1. Pre-Deployment Validation (Production Devices)
        id: pre_deploy_production
        if: ${{ !cancelled() && steps.verify.outputs.valid == 'true' }}
        env:
          NETBOX_URL: ${{ secrets.NETBOX_URL }}
          NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_SECRET: ${{ secrets.SSH_SECRET }}
          ARTIFACT_DIR: ${{ steps.paths.outputs.job_relative }}
        run: |
          set -o pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Executing Pre-Deployment Validation for Production Devices..."
          python3 -m deployment.cli \
            --use-artifact-dir "$ARTIFACT_DIR" \
            --environment production \
            --dry-run \
            --approved-by "${{ github.actor }}" \
            --approval-ref "$RUN_URL" \
            2>&1 | tee cd_pre_deploy_production.log
          echo "pre_deploy_exit_code=$?" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------------
      # 2. PRODUCTION DEPLOYMENT (REAL SSH -- PER-DEVICE FAILURE ISOLATION & ROLLBACK)
      # --------------------------------------------------------------------
      - name: 2. Production Deployment (REAL SSH)
        id: deploy
        if: ${{ !cancelled() && steps.verify.outputs.valid == 'true' && steps.pre_deploy_production.outputs.pre_deploy_exit_code == '0' }}
        continue-on-error: true
        env:
          NETBOX_URL: ${{ secrets.NETBOX_URL }}
          NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_SECRET: ${{ secrets.SSH_SECRET }}
          ARTIFACT_DIR: ${{ steps.paths.outputs.job_relative }}
        run: |
          set -o pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SAVE_FLAG=""
          if [ "${{ github.event.inputs.save_config }}" = "true" ]; then
            SAVE_FLAG="--save-config"
          fi
          echo "Executing Production Deployment and Post-Deployment Validation..."
          python3 -m deployment.cli \
            --use-artifact-dir "$ARTIFACT_DIR" \
            --environment production \
            --approved-by "${{ github.actor }}" \
            --approval-ref "$RUN_URL" \
            $SAVE_FLAG \
            2>&1 | tee cd_deploy_production_output.log
          echo "cli_exit_code=$?" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------------
      # 3. PRODUCTION POST-DEPLOYMENT VALIDATION & SUMMARY
      # --------------------------------------------------------------------
      - name: 3. Production Post-Deployment Validation & Summary
        id: summary
        if: ${{ !cancelled() && steps.verify.outputs.valid == 'true' }}
        env:
          ARTIFACT_DIR: ${{ steps.paths.outputs.job_relative }}
          CLI_EXIT_CODE: ${{ steps.deploy.outputs.cli_exit_code }}
          PRE_EXIT_CODE: ${{ steps.pre_deploy_production.outputs.pre_deploy_exit_code }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          from pathlib import Path

          artifact_dir = Path(os.environ["ARTIFACT_DIR"])
          result_path = artifact_dir / "deployment_result.json"
          cli_exit_code = os.environ.get("CLI_EXIT_CODE", "unknown")
          pre_exit_code = os.environ.get("PRE_EXIT_CODE", "unknown")

          BAD_VERDICTS = {"DRIFT", "UNREACHABLE", "FAILED"}
          lines = ["## Production Lifecycle & Compliance Summary\n"]
          lines.append(f"- **Pre-Deployment Validation Exit Code**: `{pre_exit_code}`")
          lines.append(f"- **Deployment & Verification Exit Code**: `{cli_exit_code}`\n")

          deploy_ok = False
          drift_detected = False
          deployment_failed = False
          unreachable_detected = False
          drift_details = []

          if pre_exit_code != "0":
              lines.append("> [!CAUTION]\n> ### Production Pre-Deployment Validation Failed!\n")
              deployment_failed = True
          elif not result_path.exists():
              lines.append(f"No `deployment_result.json` was produced (deployment/cli.py exit code: `{cli_exit_code}`).\n")
              lines.append("This means deployment did not reach the point of recording per-device results -- treat as FAILED.\n")
              deployment_failed = True
          else:
              payload = json.loads(result_path.read_text(encoding="utf-8"))
              results = payload.get("results", [])

              if not results:
                  lines.append("No production devices were targeted in this artifact.\n")
                  deploy_ok = True
              else:
                  lines.append("| Device | Deployment Status | Post-Deployment Verification |")
                  lines.append("|---|---|---|")
                  for r in results:
                      lines.append(f"| {r.get('device_name')} | {r.get('deployment_status')} | {r.get('verification_status')} |")
                      if r.get("deployment_status") != "success":
                          deployment_failed = True
                      elif r.get("verification_status") == "DRIFT":
                          drift_detected = True
                      elif r.get("verification_status") == "UNREACHABLE":
                          unreachable_detected = True
                      elif r.get("verification_status") in BAD_VERDICTS:
                          deployment_failed = True
                  lines.append("")

                  deploy_ok = (pre_exit_code == "0") and bool(results) and all(
                      r.get("deployment_status") == "success" and r.get("verification_status") not in BAD_VERDICTS
                      for r in results
                  )

              lines.append(f"- **Overall Production Outcome**: {'SUCCESS -- All production devices deployed and verified' if deploy_ok else 'FAILED -- Review details below'}\n")

              post_dir = Path("artifacts/post_deployment")
              if post_dir.exists():
                  for r in results:
                      dev_name = r.get("device_name")
                      if r.get("verification_status") == "DRIFT":
                          matching_files = sorted(post_dir.glob(f"*/{dev_name}.json"), key=os.path.getmtime, reverse=True)
                          if matching_files:
                              try:
                                  dev_audit = json.loads(matching_files[0].read_text(encoding="utf-8"))
                                  for d in dev_audit.get("drifts", []):
                                      drift_details.append({
                                          "device": dev_name,
                                          "protocol": d.get("protocol", "unknown"),
                                          "scope": d.get("scope", "global"),
                                          "field": d.get("field_name", "unknown"),
                                          "expected": str(d.get("expected", "")),
                                          "actual": str(d.get("actual", "")),
                                          "reason": d.get("reason", "Value mismatch")
                                      })
                              except Exception as err:
                                  print(f"Warning reading post-deployment audit file {matching_files[0]}: {err}")

              if drift_detected and not deployment_failed:
                  lines.append("> [!WARNING]")
                  lines.append("> ### ⚠️ Production Succeeded via SSH, but Post-Deployment Drift was Detected!")
                  lines.append("> All production configuration commands were pushed and backed up.")
                  lines.append("> However, post-deployment verification identified that live device state differs from NetBox Source of Truth.\n")

              if drift_details:
                  lines.append("### 🔍 Detected Configuration Drift Details\n")
                  lines.append("| Device | Protocol | Scope | Parameter | Expected (NetBox SoT) | Actual (Live Device) | Mismatch Reason |")
                  lines.append("|---|---|---|---|---|---|---|")
                  for item in drift_details:
                      lines.append(f"| `{item['device']}` | `{item['protocol']}` | `{item['scope']}` | `{item['field']}` | `{item['expected']}` | `{item['actual']}` | {item['reason']} |")
                  lines.append("")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"deploy_ok={'true' if deploy_ok else 'false'}\n")
              f.write(f"drift_detected={'true' if drift_detected else 'false'}\n")
              f.write(f"unreachable_detected={'true' if unreachable_detected else 'false'}\n")
              f.write(f"deployment_failed={'true' if deployment_failed else 'false'}\n")
          PYEOF

      - name: Upload Production Post-Deployment Compliance Audit Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: post_deployment_audit_production_${{ github.run_id }}
          path: enterprise_real_sot/artifacts/post_deployment/
          if-no-files-found: ignore

      # --------------------------------------------------------------------
      # 4. FINAL RESULT GATE
      # --------------------------------------------------------------------
      - name: 4. Final Result Gate
        if: >-
          ${{ !cancelled() && (
            steps.verify.outputs.valid != 'true' ||
            steps.pre_deploy_production.outputs.pre_deploy_exit_code != '0' ||
            steps.summary.outputs.deploy_ok != 'true'
          ) }}
        run: |
          if [ "${{ steps.pre_deploy_production.outputs.pre_deploy_exit_code }}" != "0" ]; then
            echo "::error title=Production Pre-Deployment Validation Failed::Pre-deployment validation checks failed for production devices."
            exit 1
          elif [ "${{ steps.summary.outputs.drift_detected }}" = "true" ] && [ "${{ steps.summary.outputs.deployment_failed }}" != "true" ]; then
            echo "::error title=Production Drift Detected::Configuration was pushed to production device(s), but post-deployment compliance verification detected DRIFT against NetBox Source of Truth."
            exit 1
          elif [ "${{ steps.summary.outputs.unreachable_detected }}" = "true" ] && [ "${{ steps.summary.outputs.deployment_failed }}" != "true" ]; then
            echo "::error title=Production Device Unreachable::Device was unreachable during production post-verification."
            exit 1
          elif [ "${{ steps.summary.outputs.deployment_failed }}" = "true" ]; then
            echo "::error title=Production Deployment Failed::SSH deployment to one or more production devices failed."
            exit 1
          else
            echo "::error title=Production Pipeline Failed::Artifact integrity check or production validation failed."
            exit 1
          fi
