# ==============================================================================
# ABC Telecom Network Automation Platform - Event Matrix
# ==============================================================================
# Purpose: Define discrete state-change events generated by network hardware infrastructure.
# Specification: JSON Event Telemetry Schema
# ==============================================================================

version: "1.0.0"


events:
  # ============================================================================
  # AREA A: NETWORK DEVICE HEALTH EVENTS
  # ============================================================================
  - event_type: "network.device.state_changed"
    description: "Network device reachability state transitioned (UP <-> DOWN)"
    area: "A. Network Device Health"
    severity: "CRITICAL"
    source: "SNMP Poller / ICMP Monitor"
    payload_fields: [device_name, ip_address, previous_state, current_state, downtime_seconds]

  - event_type: "network.device.cpu_threshold_exceeded"
    description: "Device CPU utilization sustained above warning/critical threshold"
    area: "A. Network Device Health"
    severity: "WARNING"
    source: "SNMP Telemetry / Streaming gNMI"
    payload_fields: [device_name, cpu_utilization_percent, threshold_percent, duration_minutes]

  - event_type: "network.device.memory_threshold_exceeded"
    description: "Device RAM memory utilization sustained above threshold"
    area: "A. Network Device Health"
    severity: "WARNING"
    source: "SNMP Telemetry / Streaming gNMI"
    payload_fields: [device_name, memory_utilization_percent, pool_name, free_bytes]

  - event_type: "network.interface.state_changed"
    description: "Interface link state transitioned (Operational UP <-> DOWN)"
    area: "A. Network Device Health"
    severity: "HIGH"
    source: "SNMP Traps / Syslog"
    payload_fields: [device_name, interface_name, admin_state, oper_state, reason]

  - event_type: "network.interface.errors_threshold_exceeded"
    description: "Interface error/drop counter rate exceeded threshold"
    area: "A. Network Device Health"
    severity: "WARNING"
    source: "SNMP Telemetry"
    payload_fields: [device_name, interface_name, in_errors_per_sec, out_errors_per_sec]

  - event_type: "network.interface.flapping_detected"
    description: "Interface experienced repeated state changes within window"
    area: "A. Network Device Health"
    severity: "HIGH"
    source: "Syslog Event Analyzer"
    payload_fields: [device_name, interface_name, flap_count, time_window_seconds]
