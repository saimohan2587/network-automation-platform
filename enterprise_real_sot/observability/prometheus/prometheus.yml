# ==============================================================================
# Prometheus Main Configuration - Network Automation Observability
# Specification: Phase 4 Production Scale & Hardening (1000+ Devices Ready)
# ==============================================================================

global:
  scrape_interval: 30s
  scrape_timeout: 25s
  evaluation_interval: 30s

rule_files:
  - "/etc/prometheus/alerts/alert_rules.yaml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "host.docker.internal:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "snmp_devices"
    metrics_path: "/snmp"
    params:
      module: ["cisco_ios"]
      auth: ["public_v2"]
    static_configs:
      # --- Staging Fleet ---
      - targets:
          - "10.10.10.2"
        labels:
          device_name: "R1_gns3"
          site: "gns3-staging"
          device_role: "router"
          vendor_os: "cisco_ios"
      - targets:
          - "10.10.20.2"
        labels:
          device_name: "SW1_gns3"
          site: "gns3-staging"
          device_role: "access"
          vendor_os: "cisco_ios"
      - targets:
          - "10.10.30.2"
        labels:
          device_name: "SW2_gns3"
          site: "gns3-staging"
          device_role: "access"
          vendor_os: "cisco_ios"
      - targets:
          - "10.10.80.2"
        labels:
          device_name: "SW3Staging_gns3"
          site: "gns3-staging"
          device_role: "access"
          vendor_os: "cisco_ios"

      # --- Production Fleet ---
      - targets:
          - "10.10.70.2"
        labels:
          device_name: "R2_gns3"
          site: "gns3-staging"
          device_role: "router"
          vendor_os: "cisco_ios"
      - targets:
          - "10.10.40.2"
        labels:
          device_name: "SW1Prod_gns3"
          site: "gns3-staging"
          device_role: "access"
          vendor_os: "cisco_ios"
      - targets:
          - "10.10.50.2"
        labels:
          device_name: "SW2Prod_gns3"
          site: "gns3-staging"
          device_role: "access"
          vendor_os: "cisco_ios"
      - targets:
          - "10.10.60.2"
        labels:
          device_name: "SW3Prod_gns3"
          site: "gns3-staging"
          device_role: "access"
          vendor_os: "cisco_ios"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "host.docker.internal:9116"
    metric_relabel_configs:
      # Filter high-cardinality non-essential interface metrics at scale
      - source_labels: [__name__]
        regex: "(ifInUnknownProtos|ifOutQLen|ifSpecific)"
        action: drop

